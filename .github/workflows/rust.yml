name: Rust

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: 1.88
        components: rustfmt,clippy

    - name: Build
      run: |
        cargo build --all-targets --all-features --locked -q
        cargo build --all-targets --no-default-features --locked -q

    - name: Run Unit tests
      run: cargo test --locked -- --nocapture

    - name: Cache integration test repos
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/zepter-test-repos
        key: test-repos-${{ hashFiles('tests/integration/**/*.yaml') }}
        restore-keys: |
          test-repos-

    - name: Run UI tests
      env:
        ZEPTER_TEST_REPOS_DIR: ${{ runner.temp }}/zepter-test-repos
      run: cargo test --locked -- --nocapture --ignored

    - name: Clippy
      run: |
        cargo clippy --all-targets --all-features --tests -q
        cargo clippy --all-targets --no-default-features -q

    - name: Format
      run: |
        cargo +nightly fmt --all --check -- --config-path .config/rustfmt.toml
